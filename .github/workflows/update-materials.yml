name: Обновление материалов курса

on:
  schedule:
    - cron: '0 3 * * *' # 06:00 по Москве
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: course-materials-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    if: github.repository != 'kryovox/cpp-start-template' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      COURSE_TEMPLATE: kryovox/cpp-start-template
    steps:
      - uses: actions/checkout@v5

      - name: Получить материалы преподавателя
        run: git clone --depth 1 "https://github.com/${COURSE_TEMPLATE}.git" "$RUNNER_TEMP/course-template"

      - name: Перенести новые материалы
        run: python3 "$RUNNER_TEMP/course-template/.github/scripts/update_materials.py" "$RUNNER_TEMP/course-template" "$GITHUB_WORKSPACE"

      - name: Сохранить обновление
        run: |
          git add --all
          if git diff --cached --quiet; then
            echo "Новых изменений нет."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "materials: обновление из шаблона курса"
          git push
